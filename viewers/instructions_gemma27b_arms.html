omputation (is 7&times;3 really 21?\nis that the 51st word?) that a linear read of one layer-32 activation cannot perform,\nwhile the two inputs sit at nearly the same point in activation space.<\/p>\n\n<h2>Format vs non-format successes<\/h2>\n<p>Red-team successes split by whether the user turn states an explicit\n<b>output-shape constraint<\/b> (\"only\", \"exactly N words\", \"no extra text\", JSON,\nhaiku, bullet counts). The complement is ordinary tasks where following the\ninstruction is a <b>semantic<\/b> property — which is what all seven\n<code>eval_instructions<\/code> splits actually test (refusal, context drift,\ncontradiction of a source, omission, answer substitution).<\/p>\n<p>The examples are spread evenly across each arm's iterations rather than taken from\nthe head of the file, so the sample isn't all iteration 0. The stat tiles give the\ntrue population share behind the sample.<\/p>\n\n<h2>Verified mislabels — and what the percentage means<\/h2>\n<p>A generated pair is shown here only when its label says <b>\"follows the\ninstruction\"<\/b> and the prompt's own constraint, run as code, says it does not.\nTen families are adjudicated (word counts, letter bans, forbidden words, exact\nliterals, JSON-only, line/bullet counts, case, punctuation) — everything else (is this a\ngood summary? did it drift?) needs a judge and is skipped.<\/p>\n<p><b>Read the percentage carefully.<\/b> It is a rate <i>within the adjudicable\nsubsample<\/i>, which is ~10&ndash;13% of pairs — <b>not<\/b> a corpus-wide mislabel rate.\nThe subsample is also not random: it over-represents <b>counting<\/b> constraints,\nwhich is the single thing the generator (<code>openai/gpt-5.1<\/code>) is worst at.<\/p>\n<table>\n<tr><th>arm<\/th><th>generated pairs<\/th><th>adjudicable<\/th><th>label refuted<\/th><\/tr>\n<tr><td>gptoss<\/td><td class='num'>484<\/td><td class='num'>49 (10%)<\/td><td class='num'>10 (20%)<\/td><\/tr><tr><td>nemotron<\/td><td class='num'>512<\/td><td class='num'>66 (13%)<\/td><td class='num'>21 (32%)<\/td><\/tr>\n<\/table>\n<p>Per family, which is where the real signal is — the generator is <b>reliable on\nstructural constraints and unreliable on counting ones<\/b>:<\/p>\n<table>\n<tr><th>arm<\/th><th>family<\/th><th>adjudicable<\/th><th>refuted<\/th><\/tr>\n<tr><td>gptoss<\/td><td><code>json-only<\/code><\/td><td class='num'>20<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>gptoss<\/td><td><code>exactly-N-words<\/code><\/td><td class='num'>18<\/td><td class='num'>10 (56%)<\/td><\/tr><tr><td>gptoss<\/td><td><code>exactly-N-lines<\/code><\/td><td class='num'>3<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>gptoss<\/td><td><code>exact-literal<\/code><\/td><td class='num'>3<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>gptoss<\/td><td><code>forbidden-word<\/code><\/td><td class='num'>3<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>gptoss<\/td><td><code>all-uppercase<\/code><\/td><td class='num'>2<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>exactly-N-words<\/code><\/td><td class='num'>24<\/td><td class='num'>17 (71%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>letter-ban<\/code><\/td><td class='num'>16<\/td><td class='num'>4 (25%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>exact-literal<\/code><\/td><td class='num'>11<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>json-only<\/code><\/td><td class='num'>7<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>all-uppercase<\/code><\/td><td class='num'>4<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>forbidden-word<\/code><\/td><td class='num'>2<\/td><td class='num'>0 (0%)<\/td><\/tr><tr><td>nemotron<\/td><td><code>no-punctuation<\/code><\/td><td class='num'>2<\/td><td class='num'>0 (0%)<\/td><\/tr>\n<\/table>\n<p>The check is deliberately <b>one-sided<\/b>. A failed check is conclusive: the\nresponse misses a constraint stated verbatim in the prompt, so \"follows\" is wrong. A\n<i>passed<\/i> check is not conclusive — the prompt may carry clauses outside the\nrepertoire that the response failed, which is often exactly what a \"does not follow\"\nlabel is recording. An earlier two-sided version flagged\n<code>\"Write exactly 7 words. The 3rd word must be 'blue'\"<\/code> &rarr;\n<code>\"I like the color blue at night\"<\/code> as mislabelled because the count was\nright; the positional clause was what failed. That direction is now withheld.<\/p>\n<p>Read it as: <i>of the pairs whose constraint a script can verify, this fraction carry a\nlabel the constraint contradicts.<\/i> The subsample is not random — it is precisely the\n<b>counting<\/b> constraints, which is the thing the generator (<code>openai/gpt-5.1<\/code>)\nis worst at. So the percentage should not be extrapolated to the other ~90% of pairs;\nstructural constraints it can satisfy exactly (valid JSON, \"output only X\") show\nessentially no mislabels. With denominators this small the percentage is also\nhigh-variance.<\/p>\n<p>What <i>is<\/i> robust is the <b>direction<\/b>: almost every mislabel claims\n<b>\"follows\"<\/b>. Asked to write the compliant member of a pair, the generator produces a\nnear-miss (45&ndash;51 words when 50 was asked) and then asserts in its own\n<code>generation_explanation<\/code> that the count is exact. Word counts here are taken\nunder the most lenient tokenizer that could make the label true, so every row shown is\nwrong under <i>every<\/i> reading.<\/p>\n\n<h2>Invisible-character attacks<\/h2>\n<p>Successes whose assistant turn carries a zero-width codepoint (ZWSP, ZWNJ, BOM,\nsoft hyphen&hellip;) or a mixed-script <b>homoglyph<\/b> — a Cyrillic <code>л<\/code> inside\nan otherwise Latin word. The attack works because the judge reads the raw string and\ncorrectly rules \"there is an extra character, so it did not follow <i>output only X<\/i>\",\nwhile a human sees a perfectly compliant reply and the probe sees an activation almost\nidentical to the compliant one.<\/p>\n<p>These produce the most extreme opposite-label twins in the corpus: the two members are\n<i>visually and semantically identical<\/i>. Codepoints are rendered as\n<code>&#10216;ZWNJ&#10217;<\/code>-style markers here and in the twins tab, or the cards would\nshow two identical conversations with opposite labels and no visible reason.<\/p>\n<p>Not every hit is an attack — NNBSP inside <code>225&#8239;g<\/code> is ordinary\ntypographic spacing, not adversarial. Each card lists the codepoints it found so the\ndistinction stays visible rather than being asserted.<\/p>\n<table><tr><th>arm<\/th><th>iteration 0<\/th><th>iteration 1<\/th><th>iteration 2<\/th><\/tr><tr><td>gptoss<\/td><td class='num'>8 / 248<\/td><td class='num'>2 / 216<\/td><td class='num'>0 / 73<\/td><\/tr><tr><td>nemotron<\/td><td class='num'>0 / 274<\/td><td class='num'>0 / 147<\/td><td class='num'>20 / 164<\/td><\/tr><\/table>\n"}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const POS = "assistant_follows_the_instruction";
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shortLab = l => l === POS ? 'follows' : (l === 'positive' ? 'follows' : (l === 'negative' ? 'does-not-follow' : 'does-not-follow'));
const isPos = l => l === POS || l === 'positive';

function conv(messages, cls) {
  return `<div class="${cls||''}">` + messages.map(m =>
    `<div class="turn"><div class="role">${esc(m.role)}</div><div class="text">${esc(m.content)}</div></div>`
  ).join('') + `</div>`;
}

/* Word-level diff so the reader can see how small the difference actually is. */
function diffPair(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length;
  // LCS over tokens; conversations here are short enough for the full table.
  const dp = Array.from({length:n+1}, () => new Uint32Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0,j=0,out='';
  while (i<n && j<m) {
    if (A[i]===B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) { out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while (i<n) { out += `<del>${esc(A[i])}</del>`; i++; }
  while (j<m) { out += `<ins>${esc(B[j])}</ins>`; j++; }
  return out;
}

const flat = ms => ms.map(m => m.role + ': ' + m.content).join('\n');

/* ------------------------------------------------------------- tab renderers */

function twinsTab(arms) {
  const rows = [];
  arms.forEach(a => a.twins.forEach(t => rows.push({arm:a.arm, ...t})));
  rows.sort((x,y) => y.ratio - x.ratio);
  return {
    rows,
    stats: arms.map(a => ({k:a.arm + ' pairs', v:a.twins.length}))
             .concat([{k:'shown', v:rows.length}]),
    search: r => r.arm + ' ' + flat(r.a) + ' ' + flat(r.b),
    render: r => {
      const aPos = isPos(r.a_label), bPos = isPos(r.b_label);
      const A = aPos ? r.a : r.b, B = aPos ? r.b : r.a;
      const aGen = aPos ? r.a_gen : r.b_gen, bGen = aPos ? r.b_gen : r.a_gen;
      return `<div class="card">
        <div class="head">
          <span class="badge">${esc(r.arm)}</span>
          <span class="badge warn">similarity ${r.ratio.toFixed(3)}</span>
          ${(r.codepoints||[]).map(c => `<span class="badge gen">${esc(c)}</span>`).join('')}
          <span class="mono">opposite labels</span>
        </div>
        <div class="cols">
          <div class="side pos"><div class="lbl">follows${aGen?' &middot; LLM-generated':' &middot; attacker-authored'}</div>${conv(A)}</div>
          <div class="side neg"><div class="lbl">does not follow${bGen?' &middot; LLM-generated':' &middot; attacker-authored'}</div>${conv(B)}</div>
        </div>
        <div class="foot diff"><b>Word diff</b> (<del>only in “does not follow”</del> / <ins>only in “follows”</ins>):
          <div style="margin-top:5px">${diffPair(flat(B), flat(A))}</div></div>
      </div>`;
    },
  };
}

function exampleTab(arms, key) {
  const rows = [];
  arms.forEach(a => a[key].forEach(e => rows.push({arm:a.arm, ...e})));
  return {
    rows,
    stats: arms.map(a => ({
      k: a.arm + (key === 'format' ? ' format' : ' non-format'),
      v: (key === 'format' ? a.n_format : a.n_nonformat) + ' / ' + a.n_successes,
    })),
    search: r => r.arm + ' ' + flat(r.messages) + ' ' + r.judge_reason,
    render: r => `<div class="card">
        <div class="head">
          <span class="badge">${esc(r.arm)}</span>
          <span class="badge">iter ${r.iteration}</span>
          <span class="badge ${r.error_type === 'false_positive' ? 'neg' : 'pos'}">${esc(r.error_type)}</span>
          <span class="mono">probe ${r.probe_score == null ? '—' : r.probe_score.toFixed(3)}</span>
          <span class="badge ${isPos(r.judge_label) ? 'pos' : 'neg'}">judge: ${esc(shortLab(r.judge_label))}</span>
          <span class="mono">conf ${r.judge_confidence}</span>
        </div>
        <div class="body">${conv(r.messages)}</div>
        <div class="foot"><b>Judge:</b> ${esc(r.judge_reason)}</div>
      </div>`,
  };
}

function mislabelTab(arms) {
  const rows = [];
  arms.forEach(a => a.mislabels.forEach(m => rows.push({arm:a.arm, ...m})));
  const st = [];
  arms.forEach(a => {
    const s = a.mislabel_stats;
    st.push({k:a.arm + ' refuted', v:`${s.refuted}/${s.checkable}`});
  });
  return {
    rows, stats: st,
    search: r => r.arm + ' ' + r.family + ' ' + flat(r.messages) + ' ' + r.explanation,
    render: r => `<div class="card">
        <div class="head">
          <span class="badge">${esc(r.arm)}</span>
          <span class="badge warn">${esc(r.family)}</span>
          <span class="badge gen">LLM-generated</span>
          <span class="badge ${r.claims_follows ? 'pos' : 'neg'}">labelled: ${esc(shortLab(r.assigned))}</span>
          <span class="mono">${esc(r.detail)}</span>
        </div>
        <div class="body">${conv(r.messages)}</div>
        <div class="foot"><b>Generator's own explanation:</b> ${esc(r.explanation)}</div>
        ${r.original.length ? `<div class="foot"><b>Rewritten from</b> (labelled ${esc(shortLab(r.original_label))}):
           <div style="margin-top:6px">${conv(r.original)}</div></div>` : ''}
      </div>`,
  };
}

function invisibleTab(arms) {
  const rows = [];
  arms.forEach(a => a.invisible.forEach(v => rows.push({arm:a.arm, ...v})));
  return {
    rows,
    stats: arms.map(a => ({k:a.arm, v:`${a.invisible.length} / ${a.n_successes}`})),
    search: r => r.arm + ' ' + r.codepoints.join(' ') + ' ' + flat(r.messages),
    render: r => `<div class="card">
        <div class="head">
          <span class="badge">${esc(r.arm)}</span>
          <span class="badge">iter ${r.iteration}</span>
          ${r.codepoints.map(c => `<span class="badge warn">${esc(c)}</span>`).join('')}
          ${r.homoglyphs.length ? `<span class="badge gen">homoglyph: ${esc(r.homoglyphs.join(', '))}</span>` : ''}
          <span class="mono">probe ${r.probe_score == null ? '—' : r.probe_score.toFixed(3)}</span>
          <span class="badge ${isPos(r.judge_label) ? 'pos' : 'neg'}">judge: ${esc(shortLab(r.judge_label))}</span>
        </div>
        <div class="body">${conv(r.messages)}</div>
        <div class="foot"><b>Judge:</b> ${esc(r.judge_reason)}</div>
      </div>`,
  };
}

function methodTab() {
  return {rows: null, html: DATA.method_html};
}

const TABS = [
  {id:'method',    name:'How to read this', build: methodTab},
  {id:'twins',     name:'Opposite-label twins', build: () => twinsTab(DATA.arms)},
  {id:'format',    name:'Format-constraint successes', build: () => exampleTab(DATA.arms, 'format')},
  {id:'nonformat', name:'Non-format successes', build: () => exampleTab(DATA.arms, 'nonformat')},
  {id:'mislabels', name:'Verified mislabels', build: () => mislabelTab(DATA.arms)},
  {id:'invisible', name:'Invisible-character attacks', build: () => invisibleTab(DATA.arms)},
];

let active = 'method', armFilter = null, query = '';

function draw() {
  const tabsEl = document.getElementById('tabs');
  const built = {};
  TABS.forEach(t => { built[t.id] = t.build(); });
  tabsEl.innerHTML = TABS.map(t => {
    const b = built[t.id];
    const n = b.rows ? b.rows.length : '';
    return `<button class="tab" role="tab" data-id="${t.id}" aria-selected="${t.id===active}">${t.name}${
      n !== '' ? `<span class="cnt">${n}</span>` : ''}</button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    active = b.dataset.id; query = ''; draw();
  });

  const t = built[active];
  const panel = document.getElementById('panel');
  if (!t.rows) { panel.innerHTML = t.html; return; }

  const arms = [...new Set(t.rows.map(r => r.arm))];
  let rows = t.rows;
  if (armFilter) rows = rows.filter(r => r.arm === armFilter);
  if (query) {
    const q = query.toLowerCase();
    rows = rows.filter(r => t.search(r).toLowerCase().includes(q));
  }
  panel.innerHTML = `
    <div class="stats">${t.stats.map(s =>
      `<div class="stat"><div class="k">${esc(s.k)}</div><div class="v">${esc(s.v)}</div></div>`).join('')}</div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Filter text…" value="${esc(query)}">
      ${arms.map(a => `<button class="chip" data-arm="${esc(a)}" aria-pressed="${armFilter===a}">${esc(a)}</button>`).join('')}
      <span class="count">${rows.length} shown</span>
    </div>
    <div>${rows.map(t.render).join('') || '<div class="note">Nothing matches that filter.</div>'}</div>`;
  const q = document.getElementById('q');
  q.oninput = () => { query = q.value; const p = q.selectionStart; draw();
    const nq = document.getElementById('q'); nq.focus(); nq.setSelectionRange(p, p); };
  panel.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    armFilter = armFilter === c.dataset.arm ? null : c.dataset.arm; draw();
  });
}
draw();
</script>
</body>
</html>
