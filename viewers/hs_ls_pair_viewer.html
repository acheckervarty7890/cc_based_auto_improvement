  .col{padding:13px 14px;min-width:0}
  .col.hi{background:var(--hi-bg);border-right:1px solid var(--line)}
  .col.lo{background:var(--lo-bg)}

  .diverge{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:2px 0 4px;font-weight:650}

<script>
const PAY=JSON.parse(document.getElementById('payload').textContent);
const esc=s=>(s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function msgHTML(m){let c=m.content;if(Array.isArray(c))c=c.map(x=>(x&&x.text)?x.text:JSON.stringify(x)).join('\n');
  return `<div class="msg"><div class="role">${esc(m.role)}</div><div class="content">${esc(c)}</div></div>`;}
function sideHTML(s,kind){const cls=kind;const label=kind==='hi'?'HIGH-STAKES':'LOW-STAKES';
  const conv=(s.msgs||[]).map(msgHTML).join('')||'<div class="meta">(empty)</div>';
  const sc=(s.score!=null?` · score=${esc(s.score)}`:'')+(s.conf!=null?` · conf=${esc(s.conf)}`:'');
  const ex=s.explain?`<div class="explain ${cls}"><b>Label rationale:</b> ${esc(s.explain)}</div>`:'';
  return `<div class="col ${cls}"><span class="badge ${cls}">${label}</span>
    <span class="meta">${esc(s.ids||('row #'+s.idx))} · label=${esc(s.label)}${sc}</span>
    <div class="diverge">Conversation</div>${conv}${ex}</div>`;}
function pairHTML(p){return `<div class="pair">
  <div class="pair-head"><span class="pair-idx">pair_id ${esc(p.pair_id)}</span>
    <span class="chip">${esc(p.hi.ids)} / ${esc(p.lo.ids)}</span>
    ${p.opposite?'':'<span class="chip">⚠ not high/low</span>'}</div>
  <div class="cols">${sideHTML(p.hi,'hi')}${sideHTML(p.lo,'lo')}</div></div>`;}
function pairText(p){const t=[...(p.hi.msgs||[]),...(p.lo.msgs||[])]
  .map(m=>typeof m.content==='string'?m.content:JSON.stringify(m.content)).join(' ');
  return (t+' '+(p.hi.explain||'')+' '+(p.lo.explain||'')).toLowerCase();}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
  const shown=q?PAY.pairs.filter(p=>pairText(p).includes(q)):PAY.pairs;
  document.getElementById('list').innerHTML=shown.map(pairHTML).join('');
  const m=PAY.meta;
  document.getElementById('count').textContent=`hs_ls_200 — showing ${shown.length} / ${m.n_pairs} pairs (${m.n_items} items, ${m.opposite_pairs} high/low opposite)`;}
document.getElementById('q').addEventListener('input',render);
document.getElementById('theme').onclick=()=>{const r=document.documentElement;
  const now=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.setAttribute('data-theme',now==='dark'?'light':'dark');};
render();
